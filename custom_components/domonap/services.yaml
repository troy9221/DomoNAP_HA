open_relay_by_door_id:
  name: Open relay by door id
  description: Opens the intercom relay using a Domonap doorId.
  fields:
    door_id:
      name: Door ID
      description: Domonap doorId.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry id
      description: Optional. Use when you have multiple Domonap accounts configured.
      required: false
      selector:
        text:

open_relay_by_key_id:
  name: Open relay by key id
  description: Opens the intercom relay using a Domonap keyId.
  fields:
    key_id:
      name: Key ID
      description: Domonap keyId.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry id
      description: Optional. Use when you have multiple Domonap accounts configured.
      required: false
      selector:
        text:

open_relay_by_last_call_door_id:
  name: Open door from last call
  description: Opens the door using DoorId from the last incoming call sensor. If the sensor state is unknown/unavailable, does nothing.
  fields:
    entity_id:
      name: Sensor entity id
      description: Optional. Entity id of the sensor that stores DoorId of the last call.
      required: false
      selector:
        entity:
          domain: sensor
    config_entry_id:
      name: Config entry id
      description: Optional. Use when you have multiple Domonap accounts configured.
      required: false
      selector:
        text:

send_support_message:
  name: Send support message
  description: Sends a message to DomoNAP support chat or to an existing ticket.
  fields:
    text:
      name: Message
      description: Message text.
      required: true
      selector:
        text:
    ticket_id:
      name: Ticket ID
      description: Optional. If set, the message is added to this support ticket.
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry id
      description: Optional. Use when you have multiple Domonap accounts configured.
      required: false
      selector:
        text:

create_support_ticket:
  name: Create support ticket
  description: Creates a new DomoNAP support appeal/ticket.
  fields:
    text:
      name: Message
      description: Ticket text.
      required: true
      selector:
        text:
    property_id:
      name: Property ID
      required: false
      selector:
        text:
    theme_id:
      name: Theme ID
      required: false
      selector:
        text:
    theme_header:
      name: Theme
      required: false
      selector:
        text:
    address:
      name: Address
      required: false
      selector:
        text:
    support_help_type:
      name: Support help type
      required: false
      selector:
        text:
    support_help_suggestion_id:
      name: Support help suggestion id
      required: false
      selector:
        text:
    activation_code:
      name: Activation code
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry id
      required: false
      selector:
        text:

get_support_tickets:
  name: Get support tickets
  description: Returns the current list of DomoNAP support tickets.
  fields:
    search:
      name: Search
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry id
      required: false
      selector:
        text:

get_support_ticket_messages:
  name: Get support ticket messages
  description: Returns messages of a DomoNAP support ticket.
  fields:
    ticket_id:
      name: Ticket ID
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry id
      required: false
      selector:
        text:

create_face:
  name: Register face / avatar
  description: Uploads a photo for face/avatar door access (проход по лицу / аватару).
  fields:
    image_url:
      name: Image URL or local file
      description: HTTP(S) URL, or a file in /config/www (for example /local/domonap-face.jpg).
      required: true
      selector:
        text:
    filename:
      name: Filename
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry id
      required: false
      selector:
        text:

delete_face:
  name: Delete face / avatar
  description: Deletes a registered face/avatar photo by imageId.
  fields:
    image_id:
      name: Image ID
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry id
      required: false
      selector:
        text:
