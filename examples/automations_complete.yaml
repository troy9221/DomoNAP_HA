# =============================================================================
# ЗВОНОК В ДОМОФОН: push с фото + открытие камеры/двери
# =============================================================================

# При входящем звонке -> push с превью, кнопкой открытия и переходом на дашборд
- id: domonap_incoming_call_push
  alias: 'Domonap: звонок в домофон (push + открыть камеру)'
  description: ''
  mode: single
  triggers:
    - trigger: event
      event_type: domonap_incoming_call
  conditions: []
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: "📞 {{ trigger.event.data.Title | default('Звонок с домофона') }}"
        message: "{{ trigger.event.data.Address | default('Домофон') }}"
        data:
          # Тап по ТЕЛУ уведомления -> открыть дашборд "Домофон" с камерой.
          url: "/domofon-dashboard"
          # Превью (подмена внутреннего IP на внешний, чтобы грузилось на телефоне).
          # Лучше задать external_url в configuration.yaml и убрать replace.
          image: >-
            {{ trigger.event.data.PhotoUrl | default('')
               | replace('YOUR_INTERNAL_IP', 'YOUR_EXTERNAL_IP') }}
          # Кнопки действия (тап по КНОПКЕ, а не по телу).
          actions:
            - action: "DOMONAP_OPEN_DOOR"
              title: "🔓 Открыть дверь"
            - action: "DOMONAP_IGNORE"
              title: "Игнорировать"
              destructive: true
          # Метаданные — какую дверь открывать по нажатию кнопки.
          action_data:
            door_id: "{{ trigger.event.data.DoorId }}"
          push:
            interruption-level: time-sensitive
            sound:
              name: default
              critical: 0

# Обработчик нажатия кнопки "Открыть дверь" из push-уведомления
- id: domonap_open_door_from_push
  alias: 'Domonap: открыть дверь по нажатию из push'
  description: ''
  mode: single
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: "DOMONAP_OPEN_DOOR"
  conditions: []
  actions:
    - action: domonap.open_relay_by_door_id
      data:
        door_id: "{{ trigger.event.data.action_data.door_id }}"
