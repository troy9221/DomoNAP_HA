# =============================================================================
# ПОЛНЫЙ automations.yaml для Domonap (пример)
# =============================================================================
# Скопируйте нужные блоки в ваш automations.yaml
# (обычно /config/automations.yaml), затем:
#   Настройки -> "Проверить конфигурацию" -> перезагрузить автоматизации
#   (Инструменты разработчика -> YAML -> "Автоматизации" или полный рестарт).
#
# Единый современный синтаксис HA (triggers/conditions/actions).
#
# ЗАМЕНИТЕ плейсхолдеры на свои значения:
#   device_tracker.your_phone        — ваш device_tracker (приложение HA Companion)
#   notify.mobile_app_your_phone     — ваш сервис уведомлений
#   zone.gate_1 / zone.gate_2 / ...  — ваши геозоны
#   YOUR_DOOR_ID_*                   — door_id ваших дверей (Разработчик -> Шаблоны)
#   YOUR_INTERNAL_IP / YOUR_EXTERNAL_IP — внутренний/внешний адрес HA
# =============================================================================

# =============================================================================
# ГЕО-АВТОМАТИЗАЦИИ: вход в зону -> открыть соответствующую дверь
# =============================================================================

# zone.gate_1 -> Калитка 1
- id: domonap_zone_kalitka_1
  alias: 'Гео: калитка 1 → открыть Калитку 1'
  description: ''
  triggers:
    - trigger: zone
      entity_id: device_tracker.your_phone
      zone: zone.gate_1
      event: enter
  conditions: []
  actions:
    - action: domonap.open_relay_by_door_id
      data:
        door_id: YOUR_DOOR_ID_GATE_1   # Калитка 1
    - action: notify.mobile_app_your_phone
      data:
        title: 🚪 Калитка 1
        message: Открываю Калитку 1 — ты рядом
  mode: single

