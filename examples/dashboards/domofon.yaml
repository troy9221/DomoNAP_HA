# =============================================================================
# YAML-дашборд "Домофон" для Home Assistant (пример по адресам/вкладкам)
# =============================================================================
# Путь на сервере (пример):
#   /config/dashboards/domofon.yaml
# После правки: на дашборде ⋮ -> "Обновить".
#
# Структура (вкладки сверху):
#   1) Дом      — домофоны с камерами (live + кнопка "Открыть") + калитки списком
#   2) Паркинг  — калитки, лестницы, въезд/выезд (нажатие сразу открывает реле)
#
# ВАЖНО: все entity_id и door_id ниже — ПЛЕЙСХОЛДЕРЫ. Замените их на свои.
#   entity_id (camera.* / binary_sensor.*) — из Разработчик -> Шаблоны/Состояния
#   door_id                                — из логов интеграции или атрибутов
# Камеры сверху (live + кнопка "Открыть"), двери без камер — списком снизу
# (нажатие сразу открывает реле).
# =============================================================================

title: Домофон
views:
  # ===========================================================================
  # ВКЛАДКА 1. Дом
  # ===========================================================================
  - title: Дом
    path: home
    icon: mdi:home-city
    cards:
      # --- Виджеты "идёт звонок" (видны только во время звонка) ---
      - type: conditional
        conditions:
          - entity: binary_sensor.domofon_entrance_1_incoming_call
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: "## 📞 Звонок — Вход 1"
            - type: picture-entity
              entity: camera.entrance_1_camera
              camera_view: live
              show_state: false
              show_name: false
            - type: button
              name: Открыть дверь
              icon: mdi:door-open
              icon_height: 48px
              tap_action:
                action: call-service
                service: domonap.open_relay_by_door_id
                data:
                  door_id: YOUR_DOOR_ID_ENTRANCE_1

      - type: conditional
        conditions:
          - entity: binary_sensor.domofon_entrance_2_incoming_call
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: "## 📞 Звонок — Вход 2"
            - type: picture-entity
              entity: camera.entrance_2_camera
              camera_view: live
              show_state: false
              show_name: false
            - type: button
              name: Открыть дверь
              icon: mdi:door-open
              icon_height: 48px
              tap_action:
                action: call-service
                service: domonap.open_relay_by_door_id
                data:
                  door_id: YOUR_DOOR_ID_ENTRANCE_2

      # --- Камеры домофонов (постоянно) ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            title: Вход 1
            entity: camera.entrance_1_camera
            camera_view: live
            show_state: false
          - type: button
            name: Открыть Вход 1
            icon: mdi:door-open
            icon_height: 40px
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_ENTRANCE_1

          - type: picture-entity
            title: Вход 2
            entity: camera.entrance_2_camera
            camera_view: live
            show_state: false
          - type: button
            name: Открыть Вход 2
            icon: mdi:door-open
            icon_height: 40px
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_ENTRANCE_2

      # --- Калитки и входы без камер (нажатие = открыть) ---
      - type: entities
        title: Калитки и входы
        show_header_toggle: false
        entities:
          - type: button
            name: Калитка 1
            icon: mdi:gate
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_GATE_1
          - type: button
            name: Калитка 2
            icon: mdi:gate
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_GATE_2
          - type: button
            name: Вход на лестницу
            icon: mdi:stairs
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_STAIRS

  # ===========================================================================
  # ВКЛАДКА 2. Паркинг
  # ===========================================================================
  - title: Паркинг
    path: parking
    icon: mdi:parking
    cards:
      - type: entities
        title: Паркинг
        show_header_toggle: false
        entities:
          - type: button
            name: Въезд
            icon: mdi:boom-gate
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_PARKING_IN
          - type: button
            name: Выезд
            icon: mdi:boom-gate-outline
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_PARKING_OUT
          - type: button
            name: Лестница 1
            icon: mdi:stairs
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_PARKING_STAIRS_1
          - type: button
            name: Лестница 2
            icon: mdi:stairs
            action_name: Открыть
            tap_action:
              action: call-service
              service: domonap.open_relay_by_door_id
              data:
                door_id: YOUR_DOOR_ID_PARKING_STAIRS_2
